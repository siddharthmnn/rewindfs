<!DOCTYPE html>
<html>
<head>
    <title>RewindFS Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;color:#111;max-width:1200px;margin:auto;padding:40px 20px;line-height:1.6}
h1{text-align:center;font-size:3rem;font-weight:700;margin-bottom:40px;letter-spacing:-2px}
h2{font-size:1.5rem;margin-bottom:16px;font-weight:600}
.section{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:24px;margin-bottom:24px;transition:.2s ease}
.section:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}
ul{list-style:none}
li{margin-bottom:10px}
button{background:#111;color:#fff;border:0;padding:10px 15px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;margin:3px}
button:hover{background:#333}
input{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:9px;font:inherit;margin-bottom:12px}
pre{background:#f7f7f7;border:1px solid #e5e5e5;border-radius:12px;padding:16px;overflow-x:auto;white-space:pre-wrap;word-wrap:break-word}
#stats{font-size:17px;white-space:pre-line}
.snapshot-link{padding:10px;border-radius:8px;margin-bottom:8px;background:#fafafa}
.snapshot-row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:10px;border-bottom:1px solid #eee}
.snapshot-row:last-child{border-bottom:0}
.file-button{background:transparent;color:#111;padding:4px 0;margin:0;text-align:left}
.file-button:hover{background:transparent;text-decoration:underline}
.muted{color:#666;font-size:13px}
.content-block{margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
</style>
</head>
<body>
    <h1>RewindFS Dashboard</h1>
    <button id="refreshButton">Refresh Dashboard</button>

    <div class="section">
        <h2>Stats</h2>
        <div id="stats">Loading...</div>
    </div>

    <div class="section">
        <h2>Files</h2>
        <ul id="files"></ul>
    </div>

    <div class="section">
        <h2>Snapshots</h2>
        <input id="snapshotSearch" type="search" placeholder="filter by file path or snapshot id" aria-label="Filter snapshots">
        <div id="snapshots">Loading...</div>
    </div>

    <div class="section">
        <h2>File Info</h2>
        <div id="fileInfo">Click a file...</div>
    </div>

    <div class="section">
        <h2>History</h2>
        <div id="history">Click a file...</div>
    </div>

    <div class="section">
        <h2>Snapshot Content</h2>
        <div id="snapshotContent">Click a snapshot...</div>
        <div class="content-block">
            <button id="restoreButton">Restore Snapshot</button>
            <button id="deleteButton">Delete Snapshot</button>
        </div>
    </div>

    <div class="section">
        <h2>Diff Viewer</h2>
        <div id="diffViewer">Select two snapshots...</div>
    </div>

<script src="/frontend/dashboard.js" defer></script>
</body>
</html>
