name: Go Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: run unit and integration tests
        run: go test ./...

      - name: run race detector
        run: go test -race ./...

      - name: run static analysis
        run: go vet ./...
